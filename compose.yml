services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: payment
      RABBITMQ_DEFAULT_PASS: payment
    ports:
      - "5672:5672"
      # Management UI for local use only; do not expose in production without network lock-down.
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: payment
      SPRING_RABBITMQ_PASSWORD: payment
      TZ: America/Sao_Paulo
      # Official challenge mock currently serves an expired TLS certificate.
      PAYMENT_HTTP_SSL_VERIFY: "false"
      PAYMENT_SEED_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  rabbitmq_data:
